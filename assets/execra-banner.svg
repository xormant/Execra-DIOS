<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metrics overview" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060B18"/>
      <stop offset="0.5" stop-color="#0B1023"/>
      <stop offset="1" stop-color="#101A2D"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101A32"/>
      <stop offset="1" stop-color="#0B1327"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.45" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>

    <style>
      .card        { fill: url(#panel); stroke: rgba(139,92,246,0.18); stroke-width: 1; }
      .card-accent { fill: url(#accent); }
      .t-label     { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; fill: #7C8AA5; }
      .t-value     { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; fill: #EAF1FF; }
      .t-delta     { font-size: 13px; font-weight: 600; fill: #2DD4BF; }
      .t-delta.down{ fill: #F87171; }
      .spark       { fill: none; stroke: url(#accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- ============ CARD 1 — x: 40 ============ -->
  <g>
    <rect class="card" x="40" y="40" width="362" height="340" rx="16"/>
    <rect class="card-accent" x="64" y="64" width="44" height="3" rx="1.5"/>
    <text class="t-label" x="64" y="100">ACTIVE USERS</text>
    <text class="t-value" x="64" y="152">24.8k</text>
    <text class="t-delta" x="64" y="178">+12.4%</text>
    <polyline class="spark" points="64,308.4 108.86,288 153.71,298.9 198.57,263.5 243.43,274.4 288.29,247.2 333.14,258.1 378,230.9"/>
  </g>

  <!-- ============ CARD 2 — x: 426 ============ -->
  <g>
    <rect class="card" x="426" y="40" width="362" height="340" rx="16"/>
    <rect class="card-accent" x="450" y="64" width="44" height="3" rx="1.5"/>
    <text class="t-label" x="450" y="100">REVENUE</text>
    <text class="t-value" x="450" y="152">$182.4k</text>
    <text class="t-delta" x="450" y="178">+8.1%</text>
    <polyline class="spark" points="450,274.4 494.86,294.8 539.71,260.8 584.57,281.2 629.43,240.4 674.29,267.6 719.14,233.6 764,249.9"/>
  </g>

  <!-- ============ CARD 3 — x: 812 ============ -->
  <g>
    <rect class="card" x="812" y="40" width="362" height="340" rx="16"/>
    <rect class="card-accent" x="836" y="64" width="44" height="3" rx="1.5"/>
    <text class="t-label" x="836" y="100">SESSIONS</text>
    <text class="t-value" x="836" y="152">96.2k</text>
    <text class="t-delta" x="836" y="178">+3.6%</text>
    <polyline class="spark" points="836,315.2 880.86,298.9 925.71,304.3 970.57,281.2 1015.43,288 1060.29,271.7 1105.14,260.8 1150,266.2"/>
  </g>

  <!-- ============ CARD 4 — x: 1198 ============ -->
  <g>
    <rect class="card" x="1198" y="40" width="362" height="340" rx="16"/>
    <rect class="card-accent" x="1222" y="64" width="44" height="3" rx="1.5"/>
    <text class="t-label" x="1222" y="100">CHURN RATE</text>
    <text class="t-value" x="1222" y="152">1.8%</text>
    <text class="t-delta" x="1222" y="178">-0.4%</text>
    <polyline class="spark" points="1222,240 1266.86,252 1311.71,246 1356.57,268 1401.43,275 1446.29,290 1491.14,300 1536,312"/>
  </g>
</svg>
